<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#2d5a3d"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Vieu Studio"/>
  <title>Vieu Art Studio</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="icon.png"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --forest:#2d5a3d;--forest-light:#3d7a54;
      --gold:#c9a227;--gold-light:#f0d06a;
      --cream:#faf7f0;--cream-dark:#f0ead8;
      --ink:#1a1a1a;--muted:#6b7057;
      --soft-green:#e8f2ea;--soft-gold:#fdf5dc;
      --red:#c0392b;--red-soft:#fdecea;
      --card-border:#ddd8cc;
      --shadow:0 2px 12px rgba(45,90,61,0.10);
      --shadow-lg:0 6px 24px rgba(45,90,61,0.15);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);min-height:100vh;overscroll-behavior:none;color:var(--ink);}
    button,input,select,textarea{font-family:'DM Sans',sans-serif;}
    button{cursor:pointer;}
    #app{max-width:600px;margin:0 auto;padding:0 12px 110px;}

    /* Sync indicator */
    .sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0;}
    .sync-dot.live{background:#4ade80;box-shadow:0 0 6px #4ade80;animation:pulse 2s infinite;}
    .sync-dot.offline{background:#9ca3af;}
    .sync-dot.error{background:#f87171;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    .sync-bar{display:flex;align-items:center;font-size:10px;font-weight:600;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,0.12);color:rgba(255,255,255,0.9);}

    /* Setup screen */
    .setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .setup-card{background:#fff;border-radius:20px;padding:28px 22px;max-width:480px;width:100%;box-shadow:0 8px 32px rgba(45,90,61,0.15);border:1px solid var(--card-border);}
    .setup-step{display:flex;gap:12px;margin-bottom:20px;align-items:flex-start;}
    .setup-num{width:28px;height:28px;border-radius:50%;background:var(--forest);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
    .setup-img{border-radius:10px;border:1.5px solid var(--card-border);width:100%;margin-top:8px;}
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-4px);padding:10px 20px;border-radius:30px;font-weight:600;font-size:13px;z-index:9999;white-space:nowrap;box-shadow:var(--shadow-lg);animation:toastIn 0.25s ease forwards;}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .toast.ok{background:var(--forest);color:#fff;}
    .toast.warn{background:#fff3cd;color:#856404;border:1px solid #ffc107;}
    .toast.err{background:#fdecea;color:#c0392b;border:1px solid #fca5a5;}

    /* Modal */
    .modal-bg{position:fixed;inset:0;background:rgba(26,26,26,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;backdrop-filter:blur(3px);animation:fadeIn 0.2s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{background:var(--cream);border-radius:24px 24px 0 0;padding:22px 18px 48px;width:100%;max-width:600px;border-top:3px solid var(--gold);max-height:90vh;overflow-y:auto;animation:slideUp 0.25s ease;}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-handle{width:36px;height:4px;background:var(--cream-dark);border-radius:2px;margin:0 auto 18px;}
    .modal-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--forest);margin-bottom:16px;}

    /* Header */
    .header{background:var(--forest);color:#fff;padding:18px 16px 14px;margin:0 -12px 16px;position:relative;overflow:hidden;}
    .header::before{content:'';position:absolute;top:-20px;right:-20px;width:130px;height:130px;background:rgba(201,162,39,0.15);border-radius:50%;}
    .header::after{content:'';position:absolute;bottom:-30px;left:-10px;width:90px;height:90px;background:rgba(201,162,39,0.10);border-radius:50%;}
    .header-logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;letter-spacing:0.5px;position:relative;z-index:1;}
    .header-logo span{color:var(--gold-light);font-style:italic;font-size:13px;}
    .header-tagline{font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;position:relative;z-index:1;}
    .header-stats{display:flex;gap:7px;margin-top:13px;position:relative;z-index:1;}
    .stat-chip{background:rgba(255,255,255,0.12);border-radius:10px;padding:7px 8px;flex:1;border:1px solid rgba(255,255,255,0.15);cursor:default;}
    .stat-chip-label{font-size:9px;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.8px;}
    .stat-chip-val{font-size:15px;font-weight:700;color:#fff;line-height:1.3;}
    .stat-chip-val.gold{color:var(--gold-light);}
    .stat-chip-val.red{color:#fca5a5;}
    .stat-chip-val.green{color:#86efac;}
    .header-actions{display:flex;gap:5px;margin-top:11px;flex-wrap:wrap;position:relative;z-index:1;}
    .action-chip{padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.10);color:rgba(255,255,255,0.9);font-size:11px;font-weight:500;transition:background 0.15s;}
    .action-chip:active{background:rgba(255,255,255,0.22);}

    /* Bazaar banner */
    .bazaar-banner{background:linear-gradient(135deg,#6d28d9,#a855f7);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .bazaar-banner-name{font-weight:700;font-size:14px;}
    .bazaar-banner-sub{font-size:11px;opacity:0.8;margin-top:2px;}
    .bazaar-end-btn{background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);color:#fff;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:700;flex-shrink:0;}

    /* Bottom nav */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--card-border);padding:8px 12px 22px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.08);}
    .nav-inner{display:flex;gap:4px;max-width:600px;margin:0 auto;}
    .nav-btn{flex:1;padding:7px 2px 5px;border-radius:12px;border:none;font-weight:600;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all 0.18s;letter-spacing:0.2px;text-transform:uppercase;position:relative;}
    .nav-btn.active{background:var(--forest);color:#fff;}
    .nav-btn.inactive{background:var(--soft-green);color:var(--forest);}
    .nav-icon{font-size:18px;}
    .nav-badge{position:absolute;top:4px;right:8px;background:#e74c3c;color:#fff;border-radius:8px;font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center;}

    /* Tabs */
    .tab-bar{display:flex;gap:4px;margin-bottom:14px;background:var(--cream-dark);border-radius:12px;padding:4px;}
    .tab-btn{flex:1;padding:7px 4px;border-radius:9px;border:none;font-weight:600;font-size:11px;transition:all 0.18s;}
    .tab-btn.active{background:var(--forest);color:#fff;box-shadow:0 2px 8px rgba(45,90,61,0.25);}
    .tab-btn.inactive{background:transparent;color:var(--muted);}

    /* Cards */
    .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--card-border);box-shadow:var(--shadow);}
    .card-title{font-family:'Playfair Display',serif;font-size:14px;color:var(--forest);margin-bottom:10px;}

    /* Inputs */
    .inp{padding:9px 12px;border-radius:10px;border:1.5px solid var(--cream-dark);font-size:13px;outline:none;background:var(--cream);width:100%;transition:border-color 0.15s,background 0.15s;color:var(--ink);}
    .inp:focus{border-color:var(--forest);background:#fff;}
    .inp.err{border-color:#e74c3c !important;background:#fff9f9;}

    /* Buttons */
    .btn-primary{padding:9px 16px;border-radius:10px;border:none;background:var(--forest);color:#fff;font-weight:600;font-size:13px;transition:opacity 0.15s,transform 0.1s;}
    .btn-primary:active{opacity:0.85;transform:scale(0.97);}
    .btn-ghost{padding:7px 13px;border-radius:10px;border:1.5px solid var(--card-border);background:var(--cream);color:var(--forest);font-weight:600;font-size:12px;}
    .btn-danger{padding:7px 11px;border-radius:10px;border:none;background:var(--red-soft);color:var(--red);font-weight:600;font-size:12px;}
    .btn-purple{padding:9px 16px;border-radius:10px;border:none;background:#6d28d9;color:#fff;font-weight:600;font-size:13px;}

    /* Pills */
    .pill{padding:5px 12px;border-radius:20px;border:1.5px solid var(--card-border);font-size:12px;font-weight:600;transition:all 0.15s;}
    .pill.active{background:var(--forest);color:#fff;border-color:var(--forest);}
    .pill.inactive{background:var(--cream);color:var(--muted);}

    /* Category chips */
    .cat-scroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
    .cat-scroll::-webkit-scrollbar{display:none;}
    .cat-chip{padding:8px 10px;border-radius:12px;border:none;text-align:center;transition:all 0.18s;cursor:pointer;min-width:78px;flex-shrink:0;}
    .cat-chip.active{box-shadow:0 3px 10px rgba(45,90,61,0.2);transform:translateY(-1px);}
    .cat-chip-name{font-size:10px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px;}
    .cat-chip-count{font-size:13px;font-weight:800;color:var(--forest);}

    /* Product grid */
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px;}
    .product-btn{padding:12px 6px 10px;border-radius:13px;text-align:center;position:relative;border:1.5px solid var(--card-border);background:#fff;transition:all 0.15s;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
    .product-btn:active{transform:scale(0.96);}
    .product-btn.in-cart{border-color:var(--forest);background:var(--soft-green);box-shadow:0 2px 8px rgba(45,90,61,0.15);}
    .product-btn.out-of-stock{border-color:#f5c6c6;background:#fff9f9;cursor:not-allowed;opacity:0.7;}
    .product-name{font-size:11px;font-weight:600;color:var(--ink);margin-bottom:3px;line-height:1.3;}
    .product-stock{font-size:11px;font-weight:700;color:var(--forest);}
    .product-stock.out{color:#e74c3c;}
    .product-price{font-size:10px;color:var(--gold);font-weight:600;margin-top:1px;}
    .cart-badge{position:absolute;top:4px;right:5px;background:var(--forest);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;}
    .tag-badge{position:absolute;top:3px;left:5px;font-size:11px;}

    /* Qty modal */
    .qty-stepper{display:flex;align-items:center;border:1.5px solid var(--cream-dark);border-radius:10px;overflow:hidden;background:var(--cream);}
    .qty-stepper button{width:38px;height:38px;border:none;background:transparent;font-size:20px;font-weight:700;color:var(--forest);}
    .qty-stepper span{flex:1;text-align:center;font-size:15px;font-weight:700;}

    /* Cart */
    .cart-card{background:var(--soft-green);border:1.5px solid #a8d5b5;border-radius:14px;padding:14px;margin-bottom:10px;}
    .cart-tag{padding:5px 10px;border-radius:8px;border:none;background:var(--forest);color:#fff;font-size:11px;font-weight:600;transition:opacity 0.15s;}
    .cart-tag:active{opacity:0.75;}

    /* Manage rows */
    .manage-row{display:flex;align-items:center;gap:7px;background:var(--cream);border-radius:11px;padding:9px 11px;border:1.5px solid var(--cream-dark);margin-bottom:7px;}

    /* Stats */
    .stats-row{display:flex;gap:8px;margin-bottom:10px;}
    .mini-stat{flex:1;background:#fff;border-radius:13px;padding:11px 8px;text-align:center;border:1px solid var(--card-border);box-shadow:var(--shadow);}
    .mini-stat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;}
    .mini-stat-val{font-size:19px;font-weight:700;color:var(--forest);margin-top:2px;}
    .mini-stat-val.gold{color:var(--gold);}
    .mini-stat-val.red{color:var(--red);}
    .mini-stat-val.green{color:#16a34a;}

    /* Rankings */
    .rank-bar-bg{width:44px;height:5px;border-radius:4px;background:var(--cream-dark);overflow:hidden;flex-shrink:0;}
    .rank-bar-fill{height:100%;border-radius:4px;background:var(--forest);}

    /* Misc */
    .divider{height:1px;background:var(--cream-dark);margin:10px 0;}
    .cat-tag{font-size:10px;font-weight:700;border-radius:6px;padding:3px 7px;white-space:nowrap;}
    .search-wrap{position:relative;margin-bottom:12px;}
    .search-wrap::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;}
    .search-inp{padding-left:32px;}
    .empty-state{text-align:center;padding:32px 16px;color:var(--muted);}
    .empty-icon{font-size:38px;margin-bottom:8px;}
    .price-tag{display:inline-block;background:var(--soft-gold);border:1px solid #e8d08a;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;color:#7a5c00;}
    .profit-tag{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;}
    .profit-tag.pos{background:#dcfce7;color:#16a34a;border:1px solid #86efac;}
    .profit-tag.neg{background:var(--red-soft);color:var(--red);border:1px solid #fca5a5;}
    .exp-row{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:var(--cream);border:1.5px solid var(--cream-dark);margin-bottom:6px;}
    .exp-cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .baz-summary{background:linear-gradient(135deg,#f5f3ff,#ede9fe);border:1.5px solid #c4b5fd;border-radius:14px;padding:16px;margin-bottom:14px;}

    /* Daily summary */
    .daily-summary{background:linear-gradient(135deg,var(--forest),var(--forest-light));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;}

    /* Settings rows */
    .setting-row{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border-radius:12px;border:1px solid var(--card-border);margin-bottom:8px;}
    .setting-label{flex:1;font-size:13px;font-weight:600;}
    .setting-sub{font-size:11px;color:var(--muted);margin-top:1px;}

    /* Toggle switch */
    .toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
    .toggle input{opacity:0;width:0;height:0;}
    .toggle-slider{position:absolute;inset:0;background:#ddd8cc;border-radius:24px;transition:0.2s;cursor:pointer;}
    .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:0.2s;}
    input:checked+.toggle-slider{background:var(--forest);}
    input:checked+.toggle-slider::before{transform:translateX(20px);}

    /* Spinner */
    .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Sold out banner */
    .soldout-banner{width:100%;text-align:left;background:#fff5f5;border:1.5px solid #fecaca;border-radius:11px;padding:9px 13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;transition:opacity 0.15s;}
    .soldout-banner:active{opacity:0.8;}
  </style>

</head>

// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
let db=null, syncStatus="offline", syncListenerActive=false, saveTimer=null;

function getFirebaseConfig(){
  try{return JSON.parse(localStorage.getItem("vieu-firebase-config")||"null");}catch{return null;}
}
function saveFirebaseConfig(cfg){
  localStorage.setItem("vieu-firebase-config",JSON.stringify(cfg));
}

function initFirebase(config){
  try{
    if(!firebase.apps.length) firebase.initializeApp(config);
    db=firebase.database();
    syncStatus="connecting";
    updateSyncUI();
    // Test connection
    db.ref(".info/connected").on("value",snap=>{
      syncStatus=snap.val()?"live":"offline";
      updateSyncUI();
    });
    // Listen for remote data changes
    if(!syncListenerActive){
      syncListenerActive=true;
      db.ref("vieu/data").on("value",snap=>{
        const d=snap.val();
        if(!d)return;
        // Only apply if remote is newer
        if(d._ts&&d._ts<=state._localTs) return;
        applyRemoteData(d);
        render();
      });
    }
    return true;
  }catch(e){
    syncStatus="error";
    updateSyncUI();
    return false;
  }
}

function applyRemoteData(d){
  if(d.inv)state.inv=d.inv;
  if(d.hist)state.hist=d.hist;
  if(d.expenses)state.expenses=d.expenses;
  if(d.locs)state.locs=d.locs;
  if(d.prices)state.prices=d.prices;
  if(d.costs)state.costs=d.costs;
  if(d.bazaar!==undefined)state.bazaar=d.bazaar;
  if(d.bazaarLog)state.bazaarLog=d.bazaarLog;
  if(d.restockLog)state.restockLog=d.restockLog;
  if(d.settings)state.settings={...state.settings,...d.settings};
}

function updateSyncUI(){
  const el=document.getElementById("sync-indicator");
  if(!el)return;
  const labels={live:"Live · Synced",offline:"Offline",connecting:"Connecting…",error:"Sync Error"};
  const dotClass={live:"live",offline:"offline",connecting:"offline",error:"error"};
  el.innerHTML='<span class="sync-dot '+dotClass[syncStatus]+'"></span>'+labels[syncStatus];
}

function saveData(){
  // Always save locally first
  try{localStorage.setItem("vieu-studio-v3",JSON.stringify({
    inv:state.inv,hist:state.hist,expenses:state.expenses,locs:state.locs,
    prices:state.prices,costs:state.costs,bazaar:state.bazaar,bazaarLog:state.bazaarLog,
    restockLog:state.restockLog,settings:state.settings,
    lastSummaryDate:state.lastSummaryDate,sheetsId:state.sheetsId,sheetsKey:state.sheetsKey
  }));}catch(e){}

  // Debounce Firebase writes (avoid hammering on rapid state changes)
  if(db&&syncStatus==="live"){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const ts=Date.now();
      state._localTs=ts;
      db.ref("vieu/data").set({
        inv:state.inv, hist:state.hist, expenses:state.expenses, locs:state.locs,
        prices:state.prices, costs:state.costs,
        bazaar:state.bazaar||null, bazaarLog:state.bazaarLog,
        restockLog:state.restockLog, settings:state.settings, _ts:ts
      }).catch(()=>{syncStatus="error";updateSyncUI();});
    },600);
  }
}

function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem("vieu-studio-v3")||localStorage.getItem("vieu-studio-v2")||"null");
    if(d){
      if(d.inv)state.inv=d.inv; if(d.hist)state.hist=d.hist;
      if(d.expenses)state.expenses=d.expenses; if(d.locs)state.locs=d.locs;
      if(d.prices)state.prices=d.prices; if(d.costs)state.costs=d.costs;
      if(d.bazaar)state.bazaar=d.bazaar; if(d.bazaarLog)state.bazaarLog=d.bazaarLog;
      if(d.restockLog)state.restockLog=d.restockLog;
      if(d.settings)state.settings={...state.settings,...d.settings};
      if(d.lastSummaryDate)state.lastSummaryDate=d.lastSummaryDate;
      if(d.sheetsId)state.sheetsId=d.sheetsId;
      if(d.sheetsKey)state.sheetsKey=d.sheetsKey;
    }
  }catch(e){}
  // Auto-connect if config saved
  const cfg=getFirebaseConfig();
  if(cfg)initFirebase(cfg);
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg,type){
  const el=document.createElement("div");
  el.className="toast "+(type||( msg.startsWith("✅")?"ok":msg.startsWith("❌")?"err":"warn"));
  el.textContent=msg;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity 0.3s";setTimeout(()=>el.remove(),300);},2400);
}

          <div style="font-size:11px;color:#e07aa0;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${soldOutItems.map(i=>i.name).join(", ")}</div>
        </div>
        <button onclick="event.stopPropagation();set('showRestockBanner',false)" style="background:rgba(192,57,43,0.12);border:none;border-radius:7px;padding:4px 8px;font-size:11px;font-weight:700;color:#c0392b;white-space:nowrap;flex-shrink:0">Hide ✕</button>
        <span style="font-size:11px;font-weight:700;color:#c0392b;white-space:nowrap;background:#fecaca;padding:4px 9px;border-radius:7px;flex-shrink:0">View →</span>
      </button>`;
    } else {
      h+=`<button onclick="set('showRestockBanner',true)" style="width:100%;background:transparent;border:1.5px dashed #fecaca;border-radius:11px;padding:7px 13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:#c0392b">
        <span style="font-size:13px">⚠️</span>
        <span style="font-size:12px;font-weight:600;flex:1;text-align:left">${soldOutItems.length} sold out in ${state.cat}</span>
        <span style="font-size:11px;font-weight:600">Show</span>
      </button>`;
    }
  }

  // Cart
  if(cartTotal>0){
    const cartRev=Object.entries(state.cart).reduce((s,[k,qty])=>{const[ic]=k.split("::");return s+qty*(state.prices[ic]||0);},0);
    h+=`<div class="cart-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:#2d5a3d">🛒 Cart <span style="color:#6b7057;font-weight:400;font-size:12px">(tap to remove)</span></div>
        <div class="price-tag">₱${cartRev.toLocaleString()}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">`;
    Object.entries(state.cart).forEach(([k,qty])=>{
      const[ic,idStr]=k.split("::");
      const item=(state.inv[ic]||[]).find(i=>i.id===Number(idStr));
      if(!item)return;
      h+=`<button class="cart-tag" onclick="untap('${k}')">${ic!==state.cat?"["+ic+"] ":""}${item.name} ×${qty} ✕</button>`;
    });
    h+=`</div><button class="btn-primary" style="width:100%;padding:12px;border-radius:12px;font-size:14px" onclick="openCheckout()">Sell ${cartTotal} item${cartTotal>1?"s":""} →</button></div>`;
  }

  h+=`<div style="font-size:11px;font-weight:700;color:#6b7057;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px">${state.cat} · ${filtered.length} designs <span style="font-weight:400;font-size:10px;color:#9ca3af">· hold to set qty</span></div>`;

  h+=`<div class="product-grid">`;
  filtered.forEach(item=>{
    const k=state.cat+"::"+item.id;
    const inCart=state.cart[k]||0;
    const left=item.qty-inCart;
    const isLiveArt=state.cat==="Live Art";
    const showOut=left<=0&&!isLiveArt;
    const catSafe=state.cat.replace(/'/g,"\\'");
    h+=`<button class="product-btn ${showOut?"out-of-stock":inCart>0?"in-cart":""}"
      onclick="tapItem('${catSafe}',${item.id})"
      oncontextmenu="openQtyModal('${catSafe}',${item.id});return false;"
      ontouchstart="startHold('${catSafe}',${item.id})"
      ontouchend="handleTouchEnd('${catSafe}',${item.id},event)"
      ontouchmove="clearHold()"
      aria-label="${item.name}">
      ${item.tag?`<span class="tag-badge">${item.tag}</span>`:""}
      ${inCart>0?`<span class="cart-badge">${inCart}</span>`:""}
      <div class="product-name">${escHtml(item.name)}</div>
      <div class="product-stock ${showOut?"out":""}">${isLiveArt?"Book":(showOut?"OUT":left+" left")}</div>
      ${(state.prices[state.cat]||0)>0?`<div class="product-price">₱${state.prices[state.cat]}</div>`:""}
      ${(()=>{const sell=state.prices[state.cat]||0,cost=state.costs[state.cat]||0;if(sell>0&&cost>0){const margin=Math.round((sell-cost)/sell*100);return`<div style="font-size:9px;font-weight:700;color:${margin>=50?"#16a34a":margin>=30?"#c9a227":"#c0392b"};margin-top:1px">${margin}% margin</div>`;}return"";})()}
    </button>`;
  });
  if(!filtered.length) h+=`<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div>No results</div></div>`;
  h+=`</div>`;
  return h;
}

// ── DATA ──────────────────────────────────────────────────────────────────────
function buildData(catKeys){
  if(state.tab==="expenses") state.dtab="report";
  if(!["log","report","restock"].includes(state.dtab)) state.dtab="log";

  let h='<div class="tab-bar">'+["log","report","restock"].map(t=>'<button class="tab-btn '+(state.dtab===t?"active":"inactive")+'" onclick="set(\'dtab\',\''+t+'\')">'+(t==="log"?"📋 Sales":t==="report"?"📈 Report":"📦 Restock")+'</button>').join("")+'</div>';

  // ── SALES LOG ────────────────────────────────────────────────────────────────
  if(state.dtab==="log"){
    const allLocNames=[...new Set(state.hist.map(h=>h.location))];
    const filtHist=state.hloc==="All"?state.hist:state.hist.filter(h=>h.location===state.hloc);
    const grouped={};
    [...filtHist].reverse().forEach(h=>{if(!grouped[h.date])grouped[h.date]=[];grouped[h.date].push(h);});
    const dtotals={};
    filtHist.forEach(h=>{const k=h.design+" ("+h.category+")";dtotals[k]=(dtotals[k]||0)+h.qty;});
    const ranked=Object.entries(dtotals).sort((a,b)=>b[1]-a[1]);
    const totalRev=filtHist.reduce((s,h)=>s+h.qty*(state.prices[h.category]||0),0);
    h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">`;
    ["All",...allLocNames].forEach(l=>{h+=`<button class="pill ${state.hloc===l?"active":"inactive"}" onclick="set('hloc','${l.replace(/'/g,"\\'")}')"> ${l}</button>`;});
    h+=`</div>`;
    h+=`<div class="stats-row">
      <div class="mini-stat"><div class="mini-stat-label">Sold</div><div class="mini-stat-val">${filtHist.reduce((s,h)=>s+h.qty,0)}</div></div>
      <div class="mini-stat"><div class="mini-stat-label">Revenue</div><div class="mini-stat-val gold">₱${totalRev.toLocaleString()}</div></div>
      <div class="mini-stat"><div class="mini-stat-label">Entries</div><div class="mini-stat-val">${filtHist.length}</div></div>
    </div>`;
    if(ranked.length){
      h+=`<div class="card"><div class="card-title">🏆 Top Designs</div>`;
      ranked.slice(0,8).forEach(([name,qty],i)=>{
        const medal=i===0?"#c9a227":i===1?"#9ca3af":i===2?"#b45309":"#a8bfa8";
        h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:11px;font-weight:800;width:22px;color:${medal}">#${i+1}</span>
          <span style="flex:1;font-size:12px">${escHtml(name)}</span>
          <span style="font-size:12px;font-weight:700;color:#2d5a3d">${qty}</span>
          <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${qty/ranked[0][1]*100}%"></div></div>
        </div>`;
      });
      h+=`</div>`;
    }
    Object.entries(grouped).forEach(([date,entries])=>{
      const dayRev=entries.reduce((s,e)=>s+e.qty*(state.prices[e.category]||0),0);
      h+=`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:12px;font-weight:700;color:#2d5a3d">${new Date(date+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</div>
          <div style="display:flex;gap:6px;align-items:center">
            <span style="font-size:11px;color:#6b7057">${entries.reduce((s,e)=>s+e.qty,0)} items</span>
            ${dayRev>0?`<span class="price-tag">₱${dayRev.toLocaleString()}</span>`:""}
          </div>
        </div>`;
      entries.forEach(e=>{
        h+=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
          <span class="cat-tag" style="background:${CC[e.category]||"#e8f2ea"};color:${CC_DOT[e.category]||"#2d5a3d"}">${e.category}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600">${escHtml(e.design)}</div>
            ${e.note?`<div style="font-size:10px;color:#9ca3af">📝 ${escHtml(e.note)}</div>`:""}
          </div>
          <span style="font-size:12px;font-weight:700;color:#2d5a3d">×${e.qty}</span>
          ${e.discount?`<span style="font-size:10px;font-weight:700;color:#c0392b">-₱${e.discount}</span>`:""}
          <span style="font-size:10px;color:#9ca3af">${e.location}</span>
        </div>`;
      });
      h+=`</div>`;
    });
    if(!filtHist.length) h+=`<div class="empty-state"><div class="empty-icon">📭</div><div>No sales yet</div></div>`;
  }

  // ── REPORT ───────────────────────────────────────────────────────────────────
  if(state.dtab==="report"){
    const allMonths=[...new Set(state.hist.map(h=>h.date.slice(0,7)))].sort().reverse();
    const allYears=[...new Set(state.hist.map(h=>h.date.slice(0,4)))].sort().reverse();
    let filtHist=state.hist, filtExp=state.expenses, periodLabel="All Time";
    if(state.repMode==="month"){
      filtHist=state.hist.filter(h=>h.date.startsWith(state.repYM));
      filtExp=state.expenses.filter(e=>e.date.startsWith(state.repYM));
      const[y,m]=state.repYM.split("-");
      periodLabel=MONTHS[parseInt(m)-1]+" "+y;
    } else if(state.repMode==="year"){
      filtHist=state.hist.filter(h=>h.date.startsWith(state.repYear));
      filtExp=state.expenses.filter(e=>e.date.startsWith(state.repYear));
      periodLabel=state.repYear;
    }
    const mQty=filtHist.reduce((s,h)=>s+h.qty,0);
    const mRev=filtHist.reduce((s,h)=>s+h.qty*(state.prices[h.category]||0),0);
    const mExp=filtExp.reduce((s,e)=>s+e.amount,0);
    const mProfit=mRev-mExp;
    const mByCat={};
    filtHist.forEach(h=>{
      if(!mByCat[h.category])mByCat[h.category]={qty:0,rev:0};
      mByCat[h.category].qty+=h.qty;
      mByCat[h.category].rev+=h.qty*(state.prices[h.category]||0);
    });
    const mByLoc={};filtHist.forEach(h=>{mByLoc[h.location]=(mByLoc[h.location]||0)+h.qty;});

    // Period picker
    h+=`<div class="card" style="padding:12px;margin-bottom:10px">
      <div style="display:flex;gap:6px;margin-bottom:${state.repMode!=="all"?"10px":"0"}">
        ${["month","year","all"].map(m=>`<button class="pill ${state.repMode===m?"active":"inactive"}" style="flex:1;text-align:center" onclick="set('repMode','${m}')">${m==="month"?"Month":m==="year"?"Year":"All Time"}</button>`).join("")}
      </div>
      ${state.repMode==="month"?'<select class="inp" style="font-weight:600;color:#2d5a3d" onchange="set(\'repYM\',this.value)">'+(allMonths.length?allMonths:[state.repYM]).map(m=>{const[y,mo]=m.split("-");return'<option value="'+m+'" '+(m===state.repYM?"selected":"")+'>'+MONTHS[parseInt(mo)-1]+' '+y+'</option>';}).join("")+'</select>':""}
      ${state.repMode==="year"?'<select class="inp" style="font-weight:600;color:#2d5a3d" onchange="set(\'repYear\',this.value)">'+(allYears.length?allYears:[state.repYear]).map(y=>'<option value="'+y+'" '+(y===state.repYear?"selected":"")+'>'+y+'</option>').join("")+'</select>':""}
    </div>`;

    // Summary stats
    h+=`<div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:center">${periodLabel}</div>
    <div class="stats-row">
      <div class="mini-stat"><div class="mini-stat-label">Sold</div><div class="mini-stat-val">${mQty}</div></div>
      <div class="mini-stat"><div class="mini-stat-label">Revenue</div><div class="mini-stat-val gold">₱${mRev.toLocaleString()}</div></div>
    </div>
    <div class="stats-row">
      <div class="mini-stat"><div class="mini-stat-label">Expenses</div><div class="mini-stat-val red">₱${mExp.toLocaleString()}</div></div>
      <div class="mini-stat"><div class="mini-stat-label">Net Profit</div><div class="mini-stat-val ${mProfit>=0?"green":"red"}">₱${mProfit.toLocaleString()}</div></div>
    </div>`;

    // Profit by product
    if(Object.keys(mByCat).length){
      h+=`<div class="card"><div class="card-title">💰 Profit by Product</div>`;
      Object.entries(mByCat).sort((a,b)=>b[1].rev-a[1].rev).forEach(([c,d])=>{
        const cost=state.costs[c]||0;
        const sell=state.prices[c]||0;
        const unitMargin=sell>0&&cost>0?Math.round((sell-cost)/sell*100):null;
        const grossProfit=d.rev-(cost*d.qty);
        const netMargin=d.rev>0?Math.round(grossProfit/d.rev*100):null;
        const mColor=netMargin===null?"#9ca3af":netMargin>=40?"#16a34a":netMargin>=15?"#c9a227":"#c0392b";
        h+=`<div style="border-radius:11px;background:${CC[c]||"#e8f2ea"};border:1px solid var(--card-border);margin-bottom:8px;overflow:hidden">
          <div style="display:flex;align-items:center;gap:8px;padding:9px 11px">
            <div style="width:8px;height:8px;border-radius:50%;background:${CC_DOT[c]||"#2d5a3d"};flex-shrink:0"></div>
            <span style="flex:1;font-size:13px;font-weight:700">${c}</span>
            <span style="font-size:11px;color:#6b7057">${d.qty} sold</span>
            <span style="font-size:13px;font-weight:800;color:${mColor}">${netMargin!==null?netMargin+"%":"—"}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;padding:7px 11px 10px;background:rgba(255,255,255,0.6);gap:4px">
            <div><div style="font-size:9px;color:#9ca3af;text-transform:uppercase">Revenue</div><div style="font-size:13px;font-weight:700;color:#c9a227">₱${Math.round(d.rev).toLocaleString()}</div></div>
            <div><div style="font-size:9px;color:#9ca3af;text-transform:uppercase">Cost</div><div style="font-size:13px;font-weight:700;color:#c0392b">₱${Math.round(cost*d.qty).toLocaleString()}</div>${cost>0?`<div style="font-size:9px;color:#9ca3af">₱${cost}/unit</div>`:""}</div>
            <div><div style="font-size:9px;color:#9ca3af;text-transform:uppercase">Profit</div><div style="font-size:13px;font-weight:700;color:${grossProfit>=0?"#16a34a":"#c0392b"}">₱${Math.round(grossProfit).toLocaleString()}</div></div>
          </div>
        </div>`;
      });
      h+=`</div>`;
    }
    if(!mQty) h+=`<div class="empty-state"><div>No sales for this period.</div></div>`;

    // By location
    if(Object.keys(mByLoc).length&&mQty>0){
      h+=`<div class="card"><div class="card-title">📍 By Location</div>`;
      Object.entries(mByLoc).sort((a,b)=>b[1]-a[1]).forEach(([l,q])=>{
        h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="flex:1;font-size:12px">${l}</span>
          <span style="font-size:12px;font-weight:700;color:#2d5a3d">${q}</span>
          <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${q/mQty*100}%"></div></div>
        </div>`;
      });
      h+=`</div>`;
    }

    // Events
    const filtBazaar=state.repMode==="all"?state.bazaarLog:state.repMode==="year"?state.bazaarLog.filter(b=>b.startDate.startsWith(state.repYear)):state.bazaarLog.filter(b=>b.startDate.startsWith(state.repYM));
    if(filtBazaar.length){
      h+=`<div class="card"><div class="card-title">🎪 Events</div>`;
      [...filtBazaar].reverse().forEach(b=>{
        const profit=b.revenue-b.expenses;
        h+=`<div style="padding:10px;border-radius:10px;background:var(--cream);border:1px solid var(--cream-dark);margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <div style="font-size:13px;font-weight:700">${escHtml(b.name)}</div>
            <span class="profit-tag ${profit>=0?"pos":"neg"}">₱${profit.toLocaleString()}</span>
          </div>
          <div style="font-size:11px;color:#6b7057">${b.location} · ${b.startDate} → ${b.endDate} · ${b.itemsSold} items</div>
        </div>`;
      });
      h+=`</div>`;
    }

    // Prices & Costs (sell editable, cost auto)
    if(state.settings.showCostMargin){
      h+=`<div class="card"><div class="card-title">⚙️ Prices & Costs</div>
        <div style="font-size:11px;color:#9ca3af;margin-bottom:10px">Cost is auto-calculated from your expenses. Only edit the sell price.</div>`;
      catKeys.forEach(c=>{
        const sell=state.prices[c]||0, cost=state.costs[c]||0;
        const margin=sell>0&&cost>0?Math.round((sell-cost)/sell*100):null;
        const mColor=margin===null?"#9ca3af":margin>=50?"#16a34a":margin>=30?"#c9a227":"#c0392b";
        h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;border-radius:10px;background:${CC[c]||"#e8f2ea"}">
          <div style="width:8px;height:8px;border-radius:50%;background:${CC_DOT[c]||"#2d5a3d"};flex-shrink:0"></div>
          <span style="flex:1;font-size:12px;font-weight:600">${c}</span>
          <div style="text-align:center">
            <div style="font-size:9px;color:#6b7057;text-transform:uppercase;letter-spacing:0.5px">Cost</div>
            <div style="font-size:12px;font-weight:700;color:#6b7057">${cost>0?"₱"+cost:"—"}</div>
          </div>
          <div style="text-align:center">
            <div style="font-size:9px;color:#6b7057;text-transform:uppercase;letter-spacing:0.5px">Sell</div>
            <input type="number" min="0" value="${sell}" class="inp" style="width:62px;text-align:center;padding:4px 6px;font-size:12px;font-weight:700;background:#fff" onchange="setPrice('${c.replace(/'/g,"\\'")}',this.value)"/>
          </div>
          <div style="text-align:center;min-width:36px">
            <div style="font-size:9px;color:#6b7057;text-transform:uppercase;letter-spacing:0.5px">Margin</div>
            <div style="font-size:12px;font-weight:800;color:${mColor}">${margin!==null?margin+"%":"—"}</div>
          </div>
        </div>`;
      });
      h+=`</div>`;
    }

    // ── EXPENSES ──────────────────────────────────────────────────────────────
    h+=`<div class="card"><div class="card-title">💸 Expenses</div>`;

    // Add expense form
    const addOpen=state.expAddOpen||false;
    h+=`<button onclick="state.expAddOpen=!${addOpen};render()" style="width:100%;background:${addOpen?"#fdecea":"var(--forest)"};color:${addOpen?"var(--red)":"#fff"};border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;margin-bottom:${addOpen?"10px":"0"}">${addOpen?"✕ Cancel":"➕ Add Expense"}</button>`;

    if(addOpen){
      const isSpecific=state.expScope==="specific";
      const selProds=state.expProducts||[];
      h+=`<div style="border-top:1px solid var(--cream-dark);margin-top:10px;padding-top:10px">
        <div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Type</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">`;
      EXP_CATS.forEach(ec=>{h+=`<button class="pill ${state.expCat===ec?"active":"inactive"}" onclick="set('expCat','${ec.replace(/'/g,"\\'")}')"> ${ec}</button>`;});
      h+=`</div>
        <div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">For</div>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="pill ${!isSpecific?"active":"inactive"}" style="flex:1;text-align:center" onclick="set('expScope','everything')">🌐 Everything</button>
          <button class="pill ${isSpecific?"active":"inactive"}" style="flex:1;text-align:center" onclick="set('expScope','specific')">🎯 One product</button>
        </div>`;
      if(isSpecific){
        h+=`<div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Which product?</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">`;
        catKeys.filter(c=>c!=="Live Art").forEach(c=>{
          const on=selProds.includes(c);
          h+=`<button class="pill ${on?"active":"inactive"}" onclick="toggleExpProduct('${c.replace(/'/g,"\\'")}')">
            <span style="width:7px;height:7px;border-radius:50%;background:${CC_DOT[c]||"#2d5a3d"};display:inline-block;margin-right:4px"></span>${c}
          </button>`;
        });
        h+=`</div>
          <div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Makes how many pieces? <span style="font-weight:400;text-transform:none;color:#9ca3af">(for accurate cost/unit)</span></div>
          <input type="number" min="1" class="inp" style="margin-bottom:12px" placeholder="e.g. 50" value="${escHtml(String(state.expYield||""))}" oninput="state.expYield=Number(this.value)||null"/>`;
      }
      h+=`<div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Note <span style="font-weight:400;text-transform:none;color:#9ca3af">(optional)</span></div>
        <input class="inp" style="margin-bottom:10px" placeholder="e.g. Clay pack, pin backs…" value="${escHtml(state.expNote)}" oninput="state.expNote=this.value"/>
        <div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Amount (₱)</div>
        <div style="display:flex;gap:8px">
          <input type="number" id="exp-amt" class="inp" style="flex:1" placeholder="0" value="${escHtml(String(state.expAmt||""))}" oninput="state.expAmt=this.value"/>
          <button class="btn-primary" onclick="addExpense()">Log It</button>
        </div>
        ${state.bazaar?`<div style="margin-top:10px;padding:8px 10px;border-radius:9px;background:#f5f3ff;font-size:12px;color:#6d28d9;font-weight:600">🎪 Linked to: ${escHtml(state.bazaar.name)}</div>`:""}
      </div>`;
    }

    // Expense log
    if(!state.expenses.length){
      h+=`<div style="text-align:center;padding:18px 0;color:#9ca3af;font-size:12px">No expenses yet</div>`;
    } else {
      const grouped={};[...state.expenses].reverse().forEach(e=>{if(!grouped[e.date])grouped[e.date]=[];grouped[e.date].push(e);});
      Object.entries(grouped).forEach(([date,entries])=>{
        const dayTotal=entries.reduce((s,e)=>s+e.amount,0);
        h+=`<div style="margin-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:11px;font-weight:700;color:#2d5a3d">${new Date(date+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}</div>
            <span style="font-size:11px;font-weight:700;color:var(--red)">₱${dayTotal.toLocaleString()}</span>
          </div>`;
        entries.forEach(e=>{
          const scopeLabel=e.scope==="specific"&&e.products&&e.products.length?e.products.join(", "):"All products";
          h+=`<div class="exp-row">
            <div class="exp-cat-dot" style="background:${EXP_COLORS[e.category]||"#6b7057"}"></div>
            <div style="flex:1">
              <div style="font-size:12px;font-weight:600">${e.category}</div>
              <div style="font-size:11px;color:#6b7057">${e.scope==="specific"?"🎯":"🌐"} ${scopeLabel}${e.yield?` · ${e.yield} pcs`:""}</div>
              ${e.note?`<div style="font-size:11px;color:#9ca3af">${escHtml(e.note)}</div>`:""}
            </div>
            <span style="font-size:13px;font-weight:700;color:var(--red)">₱${e.amount.toLocaleString()}</span>
            <button class="btn-danger" style="padding:4px 8px;font-size:11px" onclick="deleteExpense(${e.id})">✕</button>
          </div>`;
        });
        h+=`</div>`;
      });
    }
    h+=`</div>`; // close expenses card
  }

  // ── RESTOCK ──────────────────────────────────────────────────────────────────
  if(state.dtab==="restock"){
    const thr=state.settings.lowStockThreshold||2;
    const grouped={};
    Object.keys(state.inv).forEach(c=>{
      if(c==="Live Art")return;
      const low=(state.inv[c]||[]).filter(i=>i.qty<=thr);
      if(low.length)grouped[c]=low;
    });
    const totalNeeding=Object.values(grouped).reduce((s,items)=>s+items.length,0);
    if(!totalNeeding){
      h+=`<div class="empty-state"><div class="empty-icon">✅</div><div style="font-weight:700;color:#2d5a3d;font-size:16px">All stocked up!</div></div>`;
    } else {
      h+=`<div style="font-size:12px;color:#6b7057;margin-bottom:10px">${totalNeeding} design${totalNeeding>1?"s":""} need restocking</div>`;
      Object.entries(grouped).forEach(([cat,items])=>{
        const outCount=items.filter(i=>i.qty===0).length;
        const isOpen=state.restockOpenCat===cat;
        h+=`<div class="card" style="margin-bottom:8px;padding:0;overflow:hidden">
          <button onclick="set('restockOpenCat','${isOpen?"":cat.replace(/'/g,"\\'")}\')" style="width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:transparent;border:none;text-align:left">
            <div style="width:10px;height:10px;border-radius:50%;background:${CC_DOT[cat]||"#2d5a3d"};flex-shrink:0"></div>
            <span style="flex:1;font-size:13px;font-weight:700">${cat}</span>
            ${outCount>0?`<span style="background:#fdecea;color:#c0392b;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${outCount} OUT</span>`:""}
            <span style="background:#e8f2ea;color:#2d5a3d;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">${items.length} low</span>
            <span style="font-size:13px;color:#9ca3af">${isOpen?"▲":"▼"}</span>
          </button>
          ${isOpen?`<div style="border-top:1px solid var(--cream-dark);padding:8px 12px 12px">
            ${items.sort((a,b)=>a.qty-b.qty).map(item=>{
              const out=item.qty===0;
              const isRestocking=state.restockCat===cat&&state.restockId===item.id;
              if(isRestocking)return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;padding:8px 10px;border-radius:10px;background:#e8f2ea;border:1.5px solid #a8d5b5">
                <span style="flex:1;font-size:13px;font-weight:600">${escHtml(item.name)}</span>
                <input id="rst-inp" type="number" min="1" class="inp" style="width:62px;text-align:center;padding:6px" placeholder="qty" value="${state.restockAmt||""}" oninput="state.restockAmt=Number(this.value)"/>
                <button class="btn-primary" style="padding:6px 12px" onclick="doRestock()">✓</button>
                <button class="btn-ghost" style="padding:6px 10px" onclick="set('restockId',null)">✕</button>
              </div>`;
              return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:7px 10px;border-radius:10px;background:${out?"#fff5f5":"#fffbf0"};border:1.5px solid ${out?"#fecaca":"#fde68a"}">
                <span style="flex:1;font-size:13px;font-weight:600">${escHtml(item.name)}</span>
                <span style="font-weight:800;font-size:12px;color:${out?"#e74c3c":"#d4930a"}">${out?"OUT":item.qty+" left"}</span>
                <button class="btn-primary" style="padding:4px 11px;font-size:14px" onclick="startRestock('${cat.replace(/'/g,"\\'")}',${item.id})">+</button>
              </div>`;
            }).join("")}
          </div>`:""}
        </div>`;
      });
    }
    if(state.restockLog.length){
      h+=`<div class="card"><div class="card-title">📋 Restock History</div>`;
      [...state.restockLog].reverse().slice(0,20).forEach(r=>{
        h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span class="cat-tag" style="background:${CC[r.category]||"#e8f2ea"};color:${CC_DOT[r.category]||"#2d5a3d"}">${r.category}</span>
          <span style="flex:1;font-size:12px;font-weight:600">${escHtml(r.design)}</span>
          <span style="font-size:12px;font-weight:700;color:#2d5a3d">+${r.qty}</span>
          <span style="font-size:10px;color:#9ca3af">${r.date}</span>
        </div>`;
      });
      h+=`</div>`;
    }
  }

  return h;
  return h;
}


// ── MANAGE ────────────────────────────────────────────────────────────────────
function buildManage(catKeys){
  let h='<div class="tab-bar">'+["products","locations"].map(t=>'<button class="tab-btn '+(state.mtab===t?"active":"inactive")+'" onclick="set(\'mtab\',\''+t+'\')">'+(t==="products"?"🗂 Products":"📍 Locations")+'</button>').join("")+'</div>';

  if(state.mtab==="products"){
    // Profitability summary card
    // Stock value summary card with toggle
    const showVal=state.stockView==="value";
    const stockRows=catKeys.map(c=>{
      const qty=(state.inv[c]||[]).reduce((s,i)=>s+i.qty,0);
      const sell=state.prices[c]||0;
      return{c,qty,value:qty*sell};
    }).filter(r=>r.qty>0);
    const totalQty=stockRows.reduce((s,r)=>s+r.qty,0);
    const totalValue=stockRows.reduce((s,r)=>s+r.value,0);
    if(stockRows.length){
      h+=`<div class="card" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="card-title" style="margin-bottom:0">📦 Stock On-Hand</div>
          <div style="display:flex;gap:0;border:1.5px solid #ddd8cc;border-radius:8px;overflow:hidden">
            <button onclick="set('stockView','qty')" style="padding:4px 12px;font-size:11px;font-weight:700;border:none;background:${!showVal?"#2d5a3d":"#fff"};color:${!showVal?"#fff":"#6b7057"}">Qty</button>
            <button onclick="set('stockView','value')" style="padding:4px 12px;font-size:11px;font-weight:700;border:none;background:${showVal?"#2d5a3d":"#fff"};color:${showVal?"#fff":"#6b7057"}">₱ Value</button>
          </div>
        </div>`;
      stockRows.sort((a,b)=>b.value-a.value).forEach(r=>{
        const pct=showVal?(totalValue>0?r.value/totalValue:0):(totalQty>0?r.qty/totalQty:0);
        h+=`<div style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <div style="width:8px;height:8px;border-radius:50%;background:${CC_DOT[r.c]||"#2d5a3d"};flex-shrink:0"></div>
            <span style="flex:1;font-size:12px;font-weight:600">${r.c}</span>
            <span style="font-size:13px;font-weight:700;color:${showVal?"#c9a227":"#2d5a3d"}">${showVal?"₱"+r.value.toLocaleString():r.qty+" pcs"}</span>
          </div>
          <div style="height:5px;background:#f0ede6;border-radius:4px;overflow:hidden">
            <div style="height:100%;border-radius:4px;background:${CC_DOT[r.c]||"#2d5a3d"};width:${Math.round(pct*100)}%;opacity:0.7"></div>
          </div>
        </div>`;
      });
      h+=`<div style="border-top:1.5px solid #f0ede6;margin-top:6px;padding-top:8px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;font-weight:700;color:#6b7057">Total</span>
        <span style="font-size:15px;font-weight:800;color:${showVal?"#c9a227":"#2d5a3d"}">${showVal?"₱"+totalValue.toLocaleString():totalQty+" pcs"}</span>
      </div>
      ${showVal&&totalValue>0?'<div style="margin-top:4px;font-size:10px;color:#9ca3af;text-align:right">based on sell price per unit</div>':""}
      </div>`;
    }

    // Profitability at a glance
    const profitRows=catKeys.map(c=>{
      const sell=state.prices[c]||0,cost=state.costs[c]||0;
      const profit=sell-cost;
      const margin=sell>0?Math.round(profit/sell*100):null;
      return{c,sell,cost,profit,margin};
    }).filter(r=>r.sell>0);
    if(profitRows.length){
      const sorted=[...profitRows].sort((a,b)=>(b.margin??-999)-(a.margin??-999));
      h+=`<div class="card" style="margin-bottom:10px">
        <div class="card-title">💰 Profitability at a Glance</div>
        <div style="display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;align-items:center;font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;padding:0 4px">
          <span>Product</span><span style="text-align:right">Cost</span><span style="text-align:right">Price</span><span style="text-align:right">Margin</span>
        </div>`;
      sorted.forEach(({c,sell,cost,profit,margin})=>{
        const color=margin===null?"#9ca3af":margin>=50?"#16a34a":margin>=30?"#c9a227":"#c0392b";
        const bg=margin===null?"#f9fafb":margin>=50?"#dcfce7":margin>=30?"#fef9c3":"#fdecea";
        h+=`<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:4px 10px;align-items:center;padding:7px 8px;border-radius:9px;background:${bg};margin-bottom:5px">
          <div style="display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden">
            <div style="width:7px;height:7px;border-radius:50%;background:${CC_DOT[c]||"#2d5a3d"};flex-shrink:0"></div>
            <span style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c}</span>
          </div>
          <span style="font-size:11px;color:#6b7057;text-align:right;white-space:nowrap">${cost>0?"₱"+cost:"—"}</span>
          <span style="font-size:11px;font-weight:700;color:#2d5a3d;text-align:right">₱${sell}</span>
          <span style="font-size:12px;font-weight:800;color:${color};text-align:right;white-space:nowrap">${margin!==null?margin+"%":"no cost set"}</span>
        </div>`;
      });
      const withMargin=sorted.filter(r=>r.margin!==null);
      if(withMargin.length>1){
        const best=withMargin[0],worst=withMargin[withMargin.length-1];
        h+=`<div style="margin-top:8px;padding:8px 10px;border-radius:9px;background:#f0fdf4;border:1px solid #86efac;font-size:11px;color:#15803d">
          🏆 <b>${best.c}</b> is most profitable at ${best.margin}% margin${worst.margin<30?' · ⚠️ <b>'+worst.c+'</b> is lowest at '+worst.margin+'%':""}
        </div>`;
      }
      const noCostSet=profitRows.filter(r=>r.cost===0);
      if(noCostSet.length){
        h+=`<div style="margin-top:6px;padding:7px 10px;border-radius:9px;background:#fff7ed;border:1px solid #fed7aa;font-size:11px;color:#c2410c">
          ℹ️ Set material costs in <b>Data → Report → Prices & Margins</b> to see accurate margins for: ${noCostSet.map(r=>r.c).join(", ")}
        </div>`;
      }
      h+=`</div>`;
    }

    h+=`<div class="cat-scroll">`;
    catKeys.forEach(c=>{
      const t=(state.inv[c]||[]).reduce((s,i)=>s+i.qty,0);
      const active=state.cat===c;
      h+=`<button class="cat-chip ${active?"active":""}" style="background:${active?(CC[c]||"#e8f2ea"):"#fff"};border:1.5px solid ${active?(CC_DOT[c]||"#2d5a3d")+"55":"#ddd8cc"}" onclick="set('cat','${c.replace(/'/g,"\\'")}')">
        <div style="width:8px;height:8px;border-radius:50%;background:${CC_DOT[c]||"#2d5a3d"};margin:0 auto 4px"></div>
        <div class="cat-chip-name">${c}</div>
        <div class="cat-chip-count">${t}</div>
      </button>`;
    });
    h+=`</div>`;
    const catSell=state.prices[state.cat]||0,catCost=state.costs[state.cat]||0;
    const catMargin=catSell>0?Math.round((catSell-catCost)/catSell*100):null;
    const catProfitPerUnit=catSell-catCost;
    const marColor=catMargin===null?"#9ca3af":catMargin>=50?"#16a34a":catMargin>=30?"#c9a227":"#c0392b";
    h+='<div class="card">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
    h+='<div class="card-title" style="margin-bottom:0">'+state.cat+' <span style="font-size:12px;font-weight:400;color:#6b7057">· '+(state.inv[state.cat]||[]).reduce((s,i)=>s+i.qty,0)+' pcs</span></div>';
    h+='<button class="btn-danger" style="padding:5px 10px;font-size:11px" onclick="set(\'delCat\',\''+(state.cat.replace(/'/g,"\\'"))+'\')">🗑 Delete</button></div>';
    if(catSell>0){
      const bg=catMargin!==null&&catMargin>=50?"#dcfce7":catMargin!==null&&catMargin>=30?"#fef9c3":catCost>0?"#fdecea":"#f9fafb";
      const brd=catMargin!==null&&catMargin>=50?"#86efac":catMargin!==null&&catMargin>=30?"#fde047":catCost>0?"#fca5a5":"#e5e7eb";
      h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding:8px 10px;border-radius:9px;background:'+bg+';border:1px solid '+brd+'">'
       +'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:10px;color:#6b7057;font-weight:600">COST</span><span style="font-size:13px;font-weight:700">'+(catCost>0?"₱"+catCost+" <small style='color:#9ca3af'>auto</small>":"not set")+'</span></div>'
       +'<div style="color:#ddd8cc">│</div>'
       +'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:10px;color:#6b7057;font-weight:600">SELL</span><span style="font-size:13px;font-weight:700;color:#2d5a3d">₱'+catSell+'</span></div>'
       +'<div style="color:#ddd8cc">│</div>'
       +'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:10px;color:#6b7057;font-weight:600">PROFIT</span><span style="font-size:13px;font-weight:700;color:'+marColor+'">'+(catCost>0?"₱"+catProfitPerUnit+" / item":"—")+'</span></div>'
       +'<div style="color:#ddd8cc">│</div>'
       +'<div style="display:flex;align-items:center;gap:5px"><span style="font-size:10px;color:#6b7057;font-weight:600">MARGIN</span><span style="font-size:13px;font-weight:800;color:'+marColor+'">'+(catMargin!==null?catMargin+"%":"—")+'</span></div>'
       +'</div>';
    }
    if(state.delCat===state.cat){
      const dn=escHtml(state.cat), dl=(state.inv[state.cat]||[]).length;
      h+='<div style="background:#fff5f5;border-radius:11px;padding:12px;border:1.5px solid #fecaca;margin-bottom:10px">'
       +'<div style="font-size:13px;font-weight:700;color:#c0392b;margin-bottom:4px">Delete "'+dn+'"?</div>'
       +'<div style="font-size:12px;color:#6b7057;margin-bottom:10px">Removes all '+dl+' designs. Sales history kept.</div>'
       +'<div style="display:flex;gap:8px">'
       +'<button class="btn-danger" style="flex:1;padding:9px" onclick="doDeleteCategory()">Yes, Delete</button>'
       +'<button class="btn-ghost" style="flex:1;padding:9px" onclick="set(\'delCat\',null)">Cancel</button></div></div>';
    }
    (state.inv[state.cat]||[]).forEach(item=>{
      if(state.delId===item.id){
        h+=`<div style="background:#fff5f5;border-radius:11px;padding:10px 12px;border:1.5px solid #fecaca;margin-bottom:7px">
          <div style="font-size:13px;font-weight:600;color:#c0392b;margin-bottom:8px">Delete "${escHtml(item.name)}"?</div>
          <div style="display:flex;gap:8px">
            <button class="btn-danger" style="flex:1;padding:9px" onclick="doDelete(${item.id})">Yes</button>
            <button class="btn-ghost" style="flex:1;padding:9px" onclick="set('delId',null)">Cancel</button>
          </div>
        </div>`;
      } else if(state.editId===item.id){
        h+=`<div style="display:flex;gap:7px;align-items:center;background:#e8f2ea;border-radius:11px;padding:8px 10px;margin-bottom:7px">
          <input class="inp" style="flex:2;background:#fff" value="${escHtml(state.editName)}" oninput="state.editName=this.value"/>
          <input type="number" class="inp" style="width:60px;text-align:center;background:#fff" value="${state.editQty}" oninput="state.editQty=Number(this.value)"/>
          <button class="btn-primary" style="padding:8px 12px" onclick="saveEdit()">✓</button>
          <button class="btn-ghost" style="padding:8px 10px" onclick="set('editId',null)">✕</button>
        </div>`;
      } else {
        h+=`<div class="manage-row">
          <button style="width:24px;height:24px;border-radius:7px;border:1.5px solid #ddd8cc;background:#fff;font-size:13px;flex-shrink:0" onclick="cycleTag(${item.id})">${item.tag||"·"}</button>
          <span style="flex:1;font-size:13px;font-weight:500">${escHtml(item.name)}</span>
          <span style="font-size:13px;font-weight:700;color:${item.qty===0?"#e74c3c":"#2d5a3d"};min-width:26px;text-align:right">${item.qty}</span>
          <button class="btn-ghost" style="padding:5px 9px;font-size:11px" onclick="startEdit(${item.id},'${item.name.replace(/'/g,"\\'")}',${item.qty})">✏️</button>
          <button class="btn-danger" style="padding:5px 9px;font-size:11px" onclick="set('delId',${item.id})">✕</button>
        </div>`;
      }
    });
    if(!(state.inv[state.cat]||[]).length) h+=`<div class="empty-state"><div class="empty-icon">📦</div><div>No designs yet</div></div>`;
    h+=`</div>`;
    h+=`<div class="card">
      <div class="card-title">➕ Add to ${state.cat}</div>
      <div style="display:flex;gap:7px;margin-bottom:8px">
        <input class="inp" style="flex:2" placeholder="Design name…" id="new-name" value="${escHtml(state.newName)}" oninput="state.newName=this.value"/>
        <input type="number" class="inp" style="width:65px;text-align:center" id="new-qty" value="${state.newQty||""}" placeholder="0" oninput="state.newQty=Number(this.value)"/>
        <button class="btn-primary" onclick="addItem()">Add</button>
      </div>
      <div style="height:1px;background:var(--cream-dark);margin:8px 0"></div>
      <div style="font-size:11px;font-weight:600;color:#6b7057;margin-bottom:7px;text-transform:uppercase;letter-spacing:0.8px">New Category</div>
      <div style="display:flex;gap:7px">
        <input class="inp" style="flex:1" placeholder="Category name…" id="new-cat" value="${escHtml(state.newCat)}" oninput="state.newCat=this.value"/>
        <button class="btn-ghost" onclick="addCategory()">+ Add</button>
      </div>
    </div>`;
  }
  if(state.mtab==="locations"){
    h+=`<div class="card"><div class="card-title">📍 Sale Locations</div>`;
    state.locs.forEach((l,i)=>{
      h+=`<div class="manage-row">
        <span style="font-size:16px">📍</span>
        <span style="flex:1;font-size:13px;font-weight:500">${escHtml(l)}</span>
        <button class="btn-danger" onclick="deleteLoc(${i})">Remove</button>
      </div>`;
    });
    h+=`<div style="display:flex;gap:7px;margin-top:8px">

function buildCheckoutModal(cartTotal){
  const rawTotal=Object.entries(state.cart).reduce((s,[k,qty])=>{const[ic]=k.split("::");return s+qty*(state.prices[ic]||0);},0);
  const discount=Number(state.coDiscount)||0;
  const finalTotal=Math.max(0,rawTotal-discount);
  const cash=Number(state.coCash)||0;
  const change=state.coPayment==="Cash"&&cash>0?cash-finalTotal:null;

  let h='<div class="modal-bg"><div class="modal"><div class="modal-handle"></div><div class="modal-title">🛒 Checkout</div>';
  if(state.bazaar) h+='<div style="margin-bottom:12px;padding:7px 10px;border-radius:9px;background:#f5f3ff;font-size:12px;color:#6d28d9;font-weight:600">🎪 '+escHtml(state.bazaar.name)+'</div>';

  // Cart items
  h+='<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px">';
  Object.entries(state.cart).forEach(([k,qty])=>{
    const[ic,idStr]=k.split("::");
    const item=(state.inv[ic]||[]).find(i=>i.id===Number(idStr));
    if(!item)return;
    const price=state.prices[ic]||0;
    h+='<div style="padding:5px 10px;border-radius:9px;background:'+(CC[ic]||"#e8f2ea")+';border:1.5px solid '+(CC_DOT[ic]||"#2d5a3d")+'44">'
      +'<span style="font-size:12px;font-weight:600">'+escHtml(item.name)+' \xd7'+qty+'</span>'
      +(price>0?'<span style="font-size:11px;color:#6b7057;margin-left:4px">\u20b1'+(price*qty).toLocaleString()+'</span>':"")
      +'</div>';
  });
  h+='</div>';

  // Totals
  h+='<div style="background:var(--soft-gold);border-radius:12px;padding:12px 14px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center'+(discount>0?";margin-bottom:8px":"")+'"><span style="font-size:12px;color:#7a5c00;font-weight:600">Subtotal</span><span style="font-size:14px;font-weight:700;color:#2d5a3d">\u20b1'+rawTotal.toLocaleString()+'</span></div>';
  if(discount>0){
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:12px;color:#c0392b;font-weight:600">Discount</span><span style="font-size:13px;font-weight:700;color:#c0392b">\u2212\u20b1'+discount.toLocaleString()+'</span></div>'
      +'<div style="height:1px;background:#e8d08a;margin-bottom:8px"></div>';
  }
  h+='<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:#7a5c00;font-weight:700">Total</span><span style="font-size:20px;font-weight:800;color:#2d5a3d">\u20b1'+finalTotal.toLocaleString()+'</span></div></div>';

  // Payment method
  h+='<div style="font-size:11px;font-weight:700;color:#2d5a3d;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Payment</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:12px">';
  ["Cash","GCash","Card"].forEach(m=>{
    const icon=m==="Cash"?"💵":m==="GCash"?"📱":"💳";
    const active=state.coPayment===m;
    h+='<button onclick="state.coPayment=\''+m+'\';state.coCash=\'\';render()" style="flex:1;padding:10px 0;border-radius:10px;border:2px solid '+(active?"#2d5a3d":"#ddd8cc")+';background:'+(active?"#2d5a3d":"#fff")+';color:'+(active?"#fff":"#6b7057")+';font-size:13px;font-weight:700">'+icon+' '+m+'</button>';
  });
  h+='</div>';

  // Cash tendered
  if(state.coPayment==="Cash"){
    h+='<div style="margin-bottom:14px">'
      +'<div style="font-size:11px;font-weight:700;color:#6b7057;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Cash Received</div>'
      +'<input type="number" class="inp" style="font-size:18px;font-weight:700;text-align:center" placeholder="\u20b10" value="'+escHtml(String(state.coCash))+'" oninput="updateCash(this.value)" id="cash-input"/>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">';
    [20,50,100,200,500,1000].forEach(b=>{
      const sel=cash===b;
      h+='<button onclick="state.coCash='+b+';render()" style="flex:1;min-width:50px;padding:7px 4px;border-radius:8px;border:1.5px solid '+(sel?"#2d5a3d":"#ddd8cc")+';background:'+(sel?"#e8f2ea":"#fff")+';font-size:12px;font-weight:700;color:#2d5a3d">\u20b1'+b+'</button>';
    });
    const exactSel=cash===finalTotal;
    h+='<button onclick="state.coCash='+finalTotal+';render()" style="flex:2;padding:7px 8px;border-radius:8px;border:1.5px solid '+(exactSel?"#2d5a3d":"#c9a227")+';background:'+(exactSel?"#e8f2ea":"#fdf5dc")+';font-size:12px;font-weight:700;color:#2d5a3d">Exact</button>'
      +'</div>';
    if(cash>0){
      const ok=change>=0;
      h+='<div id="change-display"><div style="margin-top:10px;padding:10px 14px;border-radius:10px;background:'+(ok?"#e8f2ea":"#fdecea")+';border:2px solid '+(ok?"#2d5a3d":"#c0392b")+';display:flex;justify-content:space-between;align-items:center">'
        +'<span style="font-size:13px;font-weight:700;color:'+(ok?"#2d5a3d":"#c0392b")+'">'+(ok?"💚 Change":"⚠️ Short by")+'</span>'
        +'<span style="font-size:20px;font-weight:800;color:'+(ok?"#2d5a3d":"#c0392b")+'">\u20b1'+Math.abs(change).toLocaleString()+'</span>'
        +'</div></div>';
    } else {
      h+='<div id="change-display"></div>';
    }
    h+='</div>';
  }

  // Discount + location + note
  h+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">'
    +'<span style="font-size:12px;font-weight:700;color:#6b7057;white-space:nowrap">Discount \u20b1</span>'
    +'<input type="number" class="inp" min="0" placeholder="0" value="'+escHtml(String(state.coDiscount))+'" oninput="state.coDiscount=this.value;render()"/>'
    +'</div>'
    +'<div style="font-size:11px;font-weight:700;color:#2d5a3d;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px">Location</div>'
    +'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">';
  state.locs.forEach(l=>{h+='<button class="pill '+(state.coLoc===l?"active":"inactive")+'" onclick="set(\'coLoc\',\''+l.replace(/'/g,"\\'")+'\')"> '+l+'</button>';});
  h+='</div>'
    +'<input class="inp" style="margin-bottom:18px" placeholder="Note (optional)\u2026" value="'+escHtml(state.coNote)+'" oninput="state.coNote=this.value"/>';

  const blocked=state.coPayment==="Cash"&&cash>0&&change<0;
  h+='<button id="confirm-btn" class="btn-primary" style="width:100%;padding:14px;border-radius:12px;font-size:15px;margin-bottom:8px'+(blocked?';opacity:0.5':'')+'" onclick="confirmSale()" '+(blocked?'disabled':'')+'>✅ Confirm \u00b7 \u20b1'+finalTotal.toLocaleString()+(state.coPayment!=="Cash"?" via "+state.coPayment:"")+'</button>'
    +'<button class="btn-ghost" style="width:100%;padding:11px;border-radius:12px" onclick="set(\'showCO\',false)">Cancel</button>'
    +'</div></div>';
  return h;
}

// ── QTY MODAL (long-press) ─────────────────────────────────────────────────
let holdTimer=null;
let holdFired=false;
function startHold(cat,id){
  holdFired=false;
  holdTimer=setTimeout(()=>{holdFired=true;openQtyModal(cat,id);},600);
}
function handleTouchEnd(cat,id,e){
  if(holdFired){e.preventDefault();}
  clearHold();
}
function clearHold(){clearTimeout(holdTimer);holdTimer=null;}
function openQtyModal(cat,id){
  const item=(state.inv[cat]||[]).find(i=>i.id===id);
  if(!item)return;
  const isLiveArt=cat==="Live Art";
  const inCart=state.cart[cat+"::"+id]||0;
  const max=isLiveArt?10:item.qty-inCart;
  state.qtyModal={cat,id,name:item.name,max,qty:1,isLiveArt};
  renderQtyModal();
}
function renderQtyModal(){
  const el=document.getElementById("qty-modal");
  if(!state.qtyModal){el.innerHTML="";return;}
  const{cat,id,name,max,qty}=state.qtyModal;
  el.innerHTML=`<div class="modal-bg" onclick="closeQtyModal()"><div class="modal" style="padding-bottom:36px" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:15px;font-weight:700;color:var(--forest)">${escHtml(name)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">Set quantity to add to cart</div>
    </div>
    <div class="qty-stepper" style="margin:0 auto 18px;max-width:180px">
      <button onclick="adjQty(-1)" ${qty<=1?"disabled style='opacity:0.3'":""}>−</button>
      <span>${qty}</span>
      <button onclick="adjQty(1)" ${qty>=max?"disabled style='opacity:0.3'":""}>+</button>
    </div>

  state.coCash=val;

  const cash=Number(val)||0;
  const rawTotal=Object.entries(state.cart).reduce((s,[k,qty])=>{const[ic]=k.split("::");return s+qty*(state.prices[ic]||0);},0);

  if(!el)return;

    const ok=change>=0;
    el.innerHTML='<div style="margin-top:10px;padding:10px 14px;border-radius:10px;background:'+(ok?"#e8f2ea":"#fdecea")+';border:2px solid '+(ok?"#2d5a3d":"#c0392b")+';display:flex;justify-content:space-between;align-items:center">'

  }

function confirmSale(){
  const rawTotal=Object.entries(state.cart).reduce((s,[k,qty])=>{const[ic]=k.split("::");return s+qty*(state.prices[ic]||0);},0);
  const discount=Math.min(Number(state.coDiscount)||0,rawTotal);
  const finalTotal=Math.max(0,rawTotal-discount);
  const cash=Number(state.coCash)||0;
  if(state.coPayment==="Cash"&&cash>0&&cash<finalTotal){showToast("⚠️ Cash received is less than total","warn");return;}
  const locLabel=state.coEvent.trim()?state.coLoc+" — "+state.coEvent.trim()+(state.coDays?" ("+state.coDays+"d)":""):state.coLoc;
  const today=new Date().toISOString().slice(0,10);
  const now=new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
  const entries=[];
  const cartItems=[];
  const cartTotal=Object.values(state.cart).reduce((a,b)=>a+b,0);
  Object.entries(state.cart).forEach(([k,qty])=>{
    const[ic,idStr]=k.split("::");
    const item=(state.inv[ic]||[]).find(i=>i.id===Number(idStr));
    if(!item)return;
    const price=state.prices[ic]||0;
    cartItems.push({name:item.name,category:ic,qty,price,subtotal:qty*price});
    const entry={id:state.hist.length+entries.length+1,date:today,location:locLabel,category:ic,design:item.name,qty,payment:state.coPayment};
    if(discount>0)entry.discount=discount;
    if(state.coNote.trim())entry.note=state.coNote.trim();
    if(state.bazaar)entry.bazaarId=state.bazaar.id;
    entries.push(entry);
    if(ic!=="Live Art")state.inv[ic]=state.inv[ic].map(i=>i.id===Number(idStr)?{...i,qty:i.qty-qty}:i);
  });
  // Build receipt data
  const change=state.coPayment==="Cash"&&cash>0?cash-finalTotal:null;
  state.lastReceipt={
    date:today, time:now, items:cartItems,
    subtotal:rawTotal, discount, total:finalTotal,
    payment:state.coPayment, cash:cash||null, change,
    location:locLabel, note:state.coNote.trim(),
    bazaar:state.bazaar?state.bazaar.name:null
  };
  state.hist=[...state.hist,...entries];
  state.cart={};state.showCO=false;state.showReceipt=true;
  state.coDiscount="";state.coNote="";state.coCash="";
  saveData();render();
}

// Auto-calculate cost per unit from expenses + yield
function recalcCosts(){
  const catKeys=Object.keys(state.inv);
  catKeys.forEach(c=>{
    // Only recalc from product-specific expenses that have a yield
    const specificExps=state.expenses.filter(e=>e.scope==="specific"&&e.products&&e.products.includes(c)&&e.yield>0);
    if(specificExps.length){
      // Sum up cost-per-unit from each material: amount ÷ yield
      const costPerUnit=specificExps.reduce((s,e)=>s+e.amount/e.yield,0);
      state.costs[c]=Math.round(costPerUnit);
    }
    // If no specific expenses with yield, leave cost as-is (don't wipe it)
  });
}

async function syncToSheets(){
  if(!state.sheetsId.trim()||!state.sheetsKey.trim()){showToast("❌ Enter Sheet ID and API Key","err");return;}
  state.sheetsSyncing=true;render();
  try{
    const invRows=[["Category","Design","Qty","Status","Cost","SellPrice"]];
    Object.entries(state.inv).forEach(([c,its])=>its.forEach(item=>invRows.push([c,item.name,item.qty,item.qty>2?"In Stock":item.qty>0?"Low":"Out",state.costs[c]||0,state.prices[c]||0])));
    const salesRows=[["ID","Date","Location","Category","Design","Qty","Revenue","Discount","Note"]];
    state.hist.forEach(h=>salesRows.push([h.id,h.date,h.location,h.category,h.design,h.qty,h.qty*(state.prices[h.category]||0),h.discount||0,h.note||""]));
    const expRows=[["ID","Date","Category","Note","Amount","Scope","Products"]];
    state.expenses.forEach(e=>expRows.push([e.id,e.date,e.category,e.note||"",e.amount,e.scope,(e.products||[]).join(", ")]));
    const base=`https://sheets.googleapis.com/v4/spreadsheets/${state.sheetsId.trim()}/values`;
    const hdrs={"Content-Type":"application/json"};const k=`?key=${state.sheetsKey.trim()}`;
    await fetch(`${base}/Inventory!A1:Z1000:clear${k}`,{method:"POST",headers:hdrs});
    const r1=await fetch(`${base}/Inventory!A1${k}&valueInputOption=RAW`,{method:"PUT",headers:hdrs,body:JSON.stringify({values:invRows})});
    await fetch(`${base}/Sales!A1:Z1000:clear${k}`,{method:"POST",headers:hdrs});
    const r2=await fetch(`${base}/Sales!A1${k}&valueInputOption=RAW`,{method:"PUT",headers:hdrs,body:JSON.stringify({values:salesRows})});
    await fetch(`${base}/Expenses!A1:Z1000:clear${k}`,{method:"POST",headers:hdrs});
    await fetch(`${base}/Expenses!A1${k}&valueInputOption=RAW`,{method:"PUT",headers:hdrs,body:JSON.stringify({values:expRows})});
    if(r1.ok&&r2.ok){showToast("✅ Synced to Google Sheets!");state.showSheets=false;}
    else showToast("❌ Sync failed — check Sheet ID and permissions","err");
  }catch(e){showToast("❌ "+e.message,"err");}
  state.sheetsSyncing=false;render();
}

    h+='<button class="btn-primary" style="width:100%;padding:13px;border-radius:12px;margin-bottom:8px" onclick="connectFirebase()">🔥 Connect</button>'
      +'<button class="btn-ghost" style="width:100%;padding:11px;border-radius:12px;margin-bottom:12px" onclick="set(\'showFirebaseSetup\',false)">Cancel</button>'
      +'<div style="border-top:1px solid var(--card-border);padding-top:12px">'
      +'<div style="font-size:12px;font-weight:700;color:#2d5a3d;margin-bottom:10px">📖 How to set up Firebase (5 min)</div>';

    const steps=[
      ['1','Go to <b>firebase.google.com</b> → click <b>Get Started</b> → sign in with Google'],
      ['2','Click <b>Add project</b> → name it "Vieu Studio" → disable Google Analytics → Create project'],
      ['3','In your project: click <b>Build</b> → <b>Realtime Database</b> → <b>Create Database</b> → choose any location → select <b>Start in test mode</b> → Enable'],
      ['4','Go back to Project Overview → click the <b>web icon &lt;/&gt;</b> → register app as "vieu-pos" → you\'ll see a config block with apiKey, authDomain, databaseURL, projectId'],
      ['5','Copy those 4 values into the fields above → tap Connect'],
      ['6','<b>To invite a helper:</b> send them the HTML file → they open it → tap the sync indicator → paste the same 4 values → Connect. Done!'],
    ];
    steps.forEach(([n,text])=>{
      h+='<div style="display:flex;gap:10px;margin-bottom:12px;align-items:flex-start">'
        +'<div style="width:24px;height:24px;border-radius:50%;background:var(--forest);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</div>'
        +'<div style="font-size:12px;color:#6b7057;line-height:1.6">'+text+'</div>'
        +'</div>';
    });
    h+='</div>';
  }

  h+='</div></div>';
  return h;
}

function connectFirebase(){
  const get=id=>document.getElementById(id)?.value?.trim()||"";
  const cfg={
    apiKey:get("fb-apiKey"),
    authDomain:get("fb-authDomain"),
    databaseURL:get("fb-databaseURL"),
    projectId:get("fb-projectId"),
  };
  if(!cfg.apiKey||!cfg.databaseURL){showToast("⚠️ Fill in all fields","warn");return;}
  saveFirebaseConfig(cfg);
  const ok=initFirebase(cfg);
  if(ok){
    state.showFirebaseSetup=false;
    showToast("🔥 Connecting to Firebase…");
    render();
  } else {
    showToast("❌ Could not connect — check your config","err");
  }
}

function disconnectFirebase(){
  localStorage.removeItem("vieu-firebase-config");
  db=null; syncStatus="offline"; syncListenerActive=false;
  state.showFirebaseSetup=false;
  showToast("✅ Disconnected");
  render();
}

function escHtml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// ── CLOSE APP WARNING (active bazaar) ───────────────────────────────────────
window.addEventListener("beforeunload",e=>{
  if(state.bazaar){e.preventDefault();e.returnValue="You have an active event ("+state.bazaar.name+"). Are you sure you want to close?";}
});

// ── PWA SERVICE WORKER ───────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
render();
</script>
</body>
</html>
